<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skylark Intelligence</title><style>:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f6f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:0 auto;padding:32px 20px}.hero{background:white;border:1px solid #e6e8ef;border-radius:18px;padding:28px;box-shadow:0 8px 30px #1720330b}.brand{display:flex;align-items:center;gap:12px}.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#ffb35c,#7b61ff);display:grid;place-items:center;color:white;font-weight:800}.brand h1{margin:0;font-size:22px}.muted{color:#6b7280}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.chip{border:1px solid #e1e5ee;background:#fafbfe;padding:8px 12px;border-radius:999px;font-size:13px;cursor:pointer}.chat{margin-top:20px}.msg{padding:16px 18px;border-radius:14px;margin:12px 0;white-space:pre-wrap;line-height:1.55}.user{background:#ede9fe;margin-left:15%}.bot{background:white;border:1px solid #e6e8ef}.input{display:flex;gap:10px;margin-top:14px}.input input{flex:1;border:1px solid #d7dbe6;border-radius:12px;padding:14px;font-size:15px}.input button{border:0;border-radius:12px;padding:0 22px;background:#24204a;color:white;font-weight:700}.status{font-size:12px;margin-top:10px}.err{color:#b42318}table{width:100%;border-collapse:collapse;margin:12px 0}td,th{border-bottom:1px solid #eee;padding:8px;text-align:left}strong{font-weight:750}</style></head><body><div class="wrap"><div class="hero"><div class="brand"><div class="logo">S</div><div><h1>Skylark Intelligence</h1><div class="muted">Founder-level business intelligence · live monday.com data</div></div></div><div class="chips"><button class="chip">What's our total pipeline value?</button><button class="chip">What is our weighted pipeline and probability coverage?</button><button class="chip">Show me the open pipeline by sector.</button><button class="chip">How much has been billed, collected, and what is receivable?</button><button class="chip">Compare Mining sales pipeline with Mining work-order execution.</button><button class="chip">Find data quality issues affecting our pipeline forecast.</button><button class="chip">Give me a leadership update for the business.</button></div><div id="chat" class="chat"><div class="msg bot">Ask a founder-level business question. This app reads the live Deal Funnel and Work Order boards and does not write to them.</div></div><div class="input"><input id="q" placeholder="Ask about pipeline, revenue, sectors, execution…"><button id="send">Ask</button></div><div id="status" class="status muted">Read-only · live monday.com source</div></div></div><script>const chat=document.getElementById('chat'),q=document.getElementById('q'),status=document.getElementById('status');function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function md(s){return esc(s).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^- (.*)$/gm,'• $1').replace(/\|([^\n]+)\|/g,(m)=>m).replace(/\n/g,'<br>')}async function ask(text){chat.insertAdjacentHTML('beforeend',`<div class="msg user">${esc(text)}</div>`);status.textContent='Querying monday.com…';try{const r=await fetch('/api/query',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:text})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Request failed');chat.insertAdjacentHTML('beforeend',`<div class="msg bot">${md(j.answer)}</div>`);status.textContent='Live data · read-only';}catch(e){chat.insertAdjacentHTML('beforeend',`<div class="msg bot err">${esc(e.message)}</div>`);status.textContent='Connection error';}}document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>ask(b.textContent));document.getElementById('send').onclick=()=>{const t=q.value.trim();if(t){q.value='';ask(t)}};q.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('send').click()});</script></body></html>
